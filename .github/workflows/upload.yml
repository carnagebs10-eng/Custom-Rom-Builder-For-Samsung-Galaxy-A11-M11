name: Custom Rom Builder Samsung Galaxy A11/M11

on:
  push:
    branches:
      - main  # Change this to your desired branch
  workflow_dispatch:
    inputs:
      GSI:
        description: 'direct link for Gsi image '
        required: true
        default: 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-19.x/lineage-19.1-20230715-UNOFFICIAL-a64_bgN.img.xz'        
      ARCH:
        description: 'ARM64 or ARM32?'
        required: true
        default: '32'                
      NAME:
        description: 'Rom Name'
        required: true
        default: 'LineageOS_19.1_A11_M11_ARM32_Gapps'                

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Freeing Up Disk Space
      run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/libexec/docker

    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget
        
    - name: Preparing Files
      run: |
          wget -O a11o.zip "https://2111.filemail.com/api/file/get?filekey=MOhjkSHHosACMBf63Av_8RQXu84wAvWh087wp5WvDPY6L4nq_qDKVreM"
          unzip a11o.zip
          rm a11o.zip

    - name: Downloading your GSI
      run: |
          mkdir -p ./temp
          wget -O ./temp/gsi_system "${{ github.event.inputs.GSI }}"

    - name: Extracting GSI if compressed
      run: |
          cd ./temp
          if file gsi_system | grep -q "XZ compressed data"; then
            echo "Detected XZ archive. Decompressing..."
            mv gsi_system gsi_system.img.xz
            xz -d gsi_system.img.xz
            mv gsi_system.img system.img
          else
            echo "Detected raw image file. Proceeding..."
            mv gsi_system system.img
          fi
          cd ..

    - name: Building
      run: |
        chmod +x ./xz
        chmod +x ./size
        bash ./xz

    - name: Packaging Flashable ROM Zip
      run: |
        # 1. Create the exact nested folder structure your recovery expects
        mkdir -p ./rom_package/RisingOS-7.0-Galaxy-A11-M11/META-INF
        cd ./rom_package/RisingOS-7.0-Galaxy-A11-M11
          
        # 2. Extract your folders directly into the newly created META-INF wrapper directory
        cd META-INF
        unzip "$GITHUB_WORKSPACE/meta.zip"
        cd ..
          
        # 3. Update the extra addons folder configuration properties inside your new path
        if [ -d "./META-INF/addons/extra" ]; then
          cd ./META-INF/addons/extra
          echo "rom_name=RisingOS-Revived-7.0" > extra.txt
          echo "android_version=15" >> extra.txt
          echo "architecture=arm64" >> extra.txt
          zip -m extra.zip adb simg2img superrepack superunpack info extra.txt
          cd ../../../..
        fi
          
        # 4. Update the installation tracking text script flags
        if [ -f "./META-INF/com/google/android/updater-script" ]; then
          sed -i 's/Lineage-22.2/RisingOS-7.0-Revived/g' ./META-INF/com/google/android/updater-script || true
          sed -i 's/lineage/risingos/g' ./META-INF/com/google/android/updater-script || true
        fi
          
        # 5. Update the nested Magisk module profiling files
        MAGISK_PATH=$(find META-INF -type d -name "magisk" | head -n 1)
        if [ ! -z "$MAGISK_PATH" ]; then
          cd "$MAGISK_PATH"
          echo "id=rising_root_profile" > module.prop
          echo "name=RisingOS 7.0 Core Optimization" >> module.prop
          echo "version=7.0" >> module.prop
          echo "versionCode=70" >> module.prop
          echo "author=BiteTech & Custom Builder" >> module.prop
          echo "description=System injection layer for RisingOS Revived" >> module.prop
          echo "ro.rising.version=7.0" >> system.prop
          echo "persist.sys.rising_perf=1" >> system.prop
          echo "# RisingOS custom initialization hook" >> customize.sh
          cd ../../../..
        fi
          
        # 6. Copy your fresh kernel components cleanly (no file extension)
        cp "$GITHUB_WORKSPACE/boot" ./boot || cp "$GITHUB_WORKSPACE/temp/boot" ./boot || cp "$GITHUB_WORKSPACE/boot.img" ./boot || cp "$GITHUB_WORKSPACE/temp/boot.img" ./boot || true
          
        # 7. Auto-Locate your super image matrix using broad scanning to capture raw or pre-built XZ blocks
        RAW_SUPER=$(find $GITHUB_WORKSPACE -name "super.img" -o -name "super.new.img" | head -n 1)
        BUILT_XZ=$(find $GITHUB_WORKSPACE -name "super.new.img.xz" -o -name "super.img.xz" | head -n 1)
          
        if [ ! -z "$RAW_SUPER" ]; then
          echo "Found raw image at $RAW_SUPER. Running fast compression..."
          xz -z -1 -c "$RAW_SUPER" > ./super.new.img.xz
        elif [ ! -z "$BUILT_XZ" ] && [ "$BUILT_XZ" != "$(pwd)/super.new.img.xz" ]; then
          echo "Found pre-built compressed block at $BUILT_XZ. Copying over..."
          cp "$BUILT_XZ" ./super.new.img.xz
        else
          echo "Checking fallback directory maps..."
          cp $GITHUB_WORKSPACE/super.new.img.xz ./super.new.img.xz || cp $GITHUB_WORKSPACE/temp/super.new.img.xz ./super.new.img.xz || true
        fi
          
        # 8. Move up and package the clean folder tree structure into your final ZIP
        cd ..
        zip -r $GITHUB_WORKSPACE/RisingOS-7.0-Galaxy-A11-M11-Flashable.zip RisingOS-7.0-Galaxy-A11-M11/
        cd ..

    - name: Uploading The Zip
      uses: actions/upload-artifact@v4
      with:
        name: RisingOS-7.0-Revived-M11-A11-Flashable
        path: ${{ github.workspace }}/RisingOS-7.0-Galaxy-A11-M11-Flashable.zip
        retention-days: 7
