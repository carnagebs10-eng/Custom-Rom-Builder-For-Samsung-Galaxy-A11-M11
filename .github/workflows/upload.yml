name: Custom Rom Builder Samsung Galaxy A11/M11

on:
  push:
    branches:
      - main  # Change this to your desired branch
  workflow_dispatch:
    inputs:
      GSI:
        description: 'direct link for Gsi image '
        required: true
        default: 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-19.x/lineage-19.1-20230715-UNOFFICIAL-a64_bgN.img.xz'        
      ARCH:
        description: 'ARM64 or ARM32?'
        required: true
        default: '32'                
      NAME:
        description: 'Rom Name'
        required: true
        default: 'LineageOS_19.1_A11_M11_ARM32_Gapps'                

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Freeing Up Disk Space
      run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/libexec/docker

    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget
        
    - name: Preparing Files
      run: |
          wget -O a11o.zip "https://2111.filemail.com/api/file/get?filekey=MOhjkSHHosACMBf63Av_8RQXu84wAvWh087wp5WvDPY6L4nq_qDKVreM"
          unzip a11o.zip
          rm a11o.zip

    - name: Downloading your GSI
      run: |
          mkdir -p ./temp
          wget -O ./temp/gsi_system "${{ github.event.inputs.GSI }}"

    - name: Extracting GSI if compressed
      run: |
          cd ./temp
          if file gsi_system | grep -q "XZ compressed data"; then
            echo "Detected XZ archive. Decompressing..."
            mv gsi_system gsi_system.img.xz
            xz -d gsi_system.img.xz
            mv gsi_system.img system.img
          else
            echo "Detected raw image file. Proceeding..."
            mv gsi_system system.img
          fi
          cd ..

    - name: Building
      run: |
          chmod +x ./xz
          chmod +x ./size
          bash ./xz

    - name: Packaging Flashable ROM Zip
      run: |
        mkdir -p ./rom_package
        cd ./rom_package
          
        # Pull down Bite Tech's LineageOS 22.2 Android 15 ROM at high speed
        wget -O base_rom.zip "https://mediafire.com"
          
        # Extract only his verified, device-safe 64-bit installer frameworks and subfolders
        unzip base_rom.zip "META-INF/*"
        rm -f base_rom.zip
          
        # Strip the extension from your fresh boot image to match your target tree exactly
        cp ../boot ./boot || cp ../temp/boot ./boot || cp ../boot.img ./boot || cp ../temp/boot.img ./boot || true
          
        # Compress the large compiled super.img to .xz format using fast level-1 to prevent timeouts
        if [ -f ../super.img ]; then
          xz -z -1 -c ../super.img > ./super.new.img.xz
        elif [ -f ../temp/super.img ]; then
          xz -z -1 -c ../temp/super.img > ./super.new.img.xz
        else
          cp ../super.new.img.xz ./super.new.img.xz || cp ../temp/super.new.img.xz ./super.new.img.xz || true
        fi
          
          # Pack everything together into your exact target ZIP structure layout
          zip -r ../RisingOS-7.0-Galaxy-A11-M11-Flashable.zip META-INF boot super.new.img.xz
          cd ..

    - name: Uploading The Zip
      uses: actions/upload-artifact@v4
      with:
        name: RisingOS-7.0-Lineage22.2-Flashable
        path: ./RisingOS-7.0-Galaxy-A11-M11-Flashable.zip
        retention-days: 7
