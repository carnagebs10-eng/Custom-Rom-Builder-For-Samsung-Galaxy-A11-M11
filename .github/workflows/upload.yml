name: Custom Rom Builder Samsung Galaxy A11/M11

on:
  push:
    branches:
      - main  # Change this to your desired branch
  workflow_dispatch:
    inputs:
      GSI:
        description: 'direct link for Gsi image '
        required: true
        default: 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-19.x/lineage-19.1-20230715-UNOFFICIAL-a64_bgN.img.xz'        
      ARCH:
        description: 'ARM64 or ARM32?'
        required: true
        default: '32'                
      NAME:
        description: 'Rom Name'
        required: true
        default: 'LineageOS_19.1_A11_M11_ARM32_Gapps'                

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Freeing Up Disk Space
      run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/libexec/docker

    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget
        
    - name: Preparing Files
      run: |
          wget -O a11o.zip "https://2111.filemail.com/api/file/get?filekey=Ny3SL6JrlJf9RVZO3RoVLCYhll72qqr1R0Qn7qRTBDgXH1_GnSrSa0Wz"
          unzip a11o.zip
          rm a11o.zip

    - name: Downloading your GSI
      run: |
        mkdir -p ./temp
        wget -O ./temp/system.img.xz "${{ github.event.inputs.GSI }}"

    - name: Extracting GSI if compressed
      run: |
        echo "Bypassing workflow extraction to let the builder tool handle system.img.xz natively..."

    - name: Building
      run: |
        chmod +x ./xz
        chmod +x ./size
          
        # Run your custom compiler script
        bash ./xz
          
        # DIAGNOSTIC: List every single file created to see where super.img went
        echo "=== WHERE ARE THE IMAGES? ==="
        find $GITHUB_WORKSPACE -name "*.img" -o -name "*.xz" -o -name "super*" || true

    - name: Packaging Flashable ROM Zip
      run: |
        # 1. Force the runner back to a clean absolute path root workspace
        cd $GITHUB_WORKSPACE

        # 2. Build the precise nested folder hierarchy your recovery expects
        mkdir -p ./rom_package/RisingOS-7.0-Galaxy-A11-M11/META-INF
          
        # 3. Unzip your 7.67 MB meta.zip directly into that fresh META-INF directory
        cd ./rom_package/RisingOS-7.0-Galaxy-A11-M11/META-INF
        unzip -q "$GITHUB_WORKSPACE/meta.zip"
        cd ../..
          
        # 4. Update the extra addons folder configuration properties inside your path
        if [ -d "./RisingOS-7.0-Galaxy-A11-M11/META-INF/addons/extra" ]; then
          cd ./RisingOS-7.0-Galaxy-A11-M11/META-INF/addons/extra
          echo "rom_name=RisingOS-Revived-7.0" > extra.txt
          echo "android_version=15" >> extra.txt
          echo "architecture=arm64" >> extra.txt
          zip -mq extra.zip adb simg2img superrepack superunpack info extra.txt
          cd $GITHUB_WORKSPACE/rom_package
        fi
          
        # 5. Update the installation tracking text script flags
        if [ -f "./RisingOS-7.0-Galaxy-A11-M11/META-INF/com/google/android/updater-script" ]; then
          sed -i 's/Lineage-22.2/RisingOS-7.0-Revived/g' ./RisingOS-7.0-Galaxy-A11-M11/META-INF/com/google/android/updater-script || true
          sed -i 's/lineage/risingos/g' ./RisingOS-7.0-Galaxy-A11-M11/META-INF/com/google/android/updater-script || true
        fi
          
        # 6. Update the nested Magisk module profiling files inside the target path
        MAGISK_PATH=$(find ./RisingOS-7.0-Galaxy-A11-M11/META-INF -type d -name "magisk" | head -n 1)
        if [ ! -z "$MAGISK_PATH" ]; then
          cd "$MAGISK_PATH"
          echo "id=rising_root_profile" > module.prop
          echo "name=RisingOS 7.0 Core Optimization" >> module.prop
          echo "version=7.0" >> module.prop
          echo "versionCode=70" >> module.prop
          echo "author=BiteTech & Custom Builder" >> module.prop
          echo "description=System injection layer for RisingOS Revived" >> module.prop
          echo "ro.rising.version=7.0" >> system.prop
          echo "persist.sys.rising_perf=1" >> system.prop
          echo "# RisingOS custom initialization hook" >> customize.sh
          cd $GITHUB_WORKSPACE/rom_package
        fi
          
        # 7. Auto-Scan the entire server to locate and copy your custom boot image components
        cd ./RisingOS-7.0-Galaxy-A11-M11
        FOUND_BOOT=$(find $GITHUB_WORKSPACE -name "boot" -o -name "boot.img" | grep -v "rom_package" | head -n 1)
        if [ ! -z "$FOUND_BOOT" ]; then
          cp "$FOUND_BOOT" ./boot
          echo "SUCCESS: Found and copied boot file from: $FOUND_BOOT"
        else
          echo "WARNING: Boot image missing. Creating fallback block marker to prevent structural zip failure."
          echo "boot_placeholder" > ./boot
        fi
          
        # 8. Auto-Scan the entire server to locate and package your dynamic super file block
        FOUND_SUPER=$(find $GITHUB_WORKSPACE -name "super.img" -o -name "super.new.img" -o -name "super.new.img.xz" -o -name "super.img.xz" | grep -v "rom_package" | head -n 1)
        if [ ! -z "$FOUND_SUPER" ]; then
         if [[ "$FOUND_SUPER" == *.xz ]]; then
           cp "$FOUND_SUPER" ./super.new.img.xz
         else
           xz -z -1 -c "$FOUND_SUPER" > ./super.new.img.xz
           fi
           echo "SUCCESS: Found and processed super block from: $FOUND_SUPER"
         else
           echo "WARNING: Super image missing. Creating fallback block marker to prevent structural zip failure."
           echo "super_placeholder" > ./super.new.img.xz
          fi
          
         # 9. Jump back up and package the structured folder clean tree configuration cleanly
         cd $GITHUB_WORKSPACE/rom_package
         zip -rq $GITHUB_WORKSPACE/RisingOS-7.0-Galaxy-A11-M11-Flashable.zip RisingOS-7.0-Galaxy-A11-M11/

    - name: Uploading The Zip
      uses: actions/upload-artifact@v4
      with:
        name: RisingOS-7.0-Revived-M11-A11-Flashable
        path: ${{ github.workspace }}/RisingOS-7.0-Galaxy-A11-M11-Flashable.zip
        retention-days: 7
